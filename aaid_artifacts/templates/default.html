<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B1220;
    --ink-soft: #333B49;
    --muted: #667085;
    --paper: #FFFFFF;
    --paper-alt: #F5F6F8;
    --line: #E1E4E9;
    --accent: #0E7C86;
    --accent-dark: #0A5C64;
    --accent-soft: #E4F2F1;
    --code-bg: #0B1220;
    --code-text: #E7ECF3;
    --font-display: 'Space Grotesk', 'Segoe UI', sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.7;
    color: var(--ink-soft);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- COVER ---------- */
  .cover {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px 56px;
    page-break-after: always;
    background-image:
      radial-gradient(circle, #D8DCE2 1px, transparent 1px);
    background-size: 22px 22px;
    background-position: -6px -6px;
    overflow: hidden;
  }
  .cover::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0) 55%, var(--paper) 96%);
    pointer-events: none;
  }
  .cover-top {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .logo-slot {
    width: 132px;
    height: 44px;
    border: 1px dashed #C7CBD2;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9CA3AF;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: rgba(255,255,255,0.6);
  }

  .cover-main {
    position: relative;
    z-index: 1;
    max-width: 760px;
  }
  .project-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--accent);
    color: var(--accent-dark);
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    padding: 5px 12px;
    border-radius: 3px;
    margin-bottom: 28px;
    background: var(--accent-soft);
  }
  .project-tag::before {
    content: "";
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 1px;
    display: inline-block;
  }
  .cover h1 {
    font-family: var(--font-display);
    font-size: 46px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.15;
    letter-spacing: -0.01em;
  }

  /* Document control block — engineering title-block convention */
  .doc-block {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--ink);
    margin-top: 48px;
  }
  .doc-block div {
    padding: 14px 20px 0 0;
    border-right: 1px solid var(--line);
  }
  .doc-block div:last-child { border-right: none; padding-right: 0; }
  .doc-field-label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .doc-field-value {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink);
    font-weight: 500;
  }

  /* ---------- CONTENT ---------- */
  .content { max-width: 820px; margin: 0 auto; padding: 64px 80px 100px; counter-reset: section; }

  h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); font-weight: 600; line-height: 1.3; color: var(--ink); margin-top: 2.1em; margin-bottom: 0.6em; page-break-after: avoid; }
  .content > h1:first-child, .content > h2:first-child { margin-top: 0; }

  h1 { font-size: 30px; font-weight: 700; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }

  h2 { font-size: 22px; padding-bottom: 10px; border-bottom: 1px solid var(--line); counter-increment: section; display: flex; align-items: baseline; gap: 10px; }
  h2::before {
    content: counter(section, decimal-leading-zero);
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 500;
    color: var(--accent);
    flex-shrink: 0;
  }

  h3 { font-size: 18px; }
  h4 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }

  p { margin-bottom: 1em; }
  a { color: var(--accent-dark); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  a:hover { border-bottom-color: var(--accent-dark); }
  strong { font-weight: 700; color: var(--ink); }
  em { font-style: italic; }

  ul, ol { margin: 0.5em 0 1em 1.4em; }
  li { margin-bottom: 0.35em; }
  li > ul, li > ol { margin-top: 0.35em; margin-bottom: 0; }
  ul > li::marker { color: var(--accent); }

  blockquote { border-left: 3px solid var(--accent); padding: 10px 22px; margin: 1.2em 0; background: var(--paper-alt); border-radius: 0 4px 4px 0; color: var(--ink-soft); page-break-inside: avoid; }

  code { font-family: var(--font-mono); font-size: 13px; background: var(--paper-alt); padding: 2px 6px; border-radius: 3px; color: var(--accent-dark); }
  pre { background: var(--code-bg); border-radius: 6px; padding: 20px 24px; overflow-x: auto; margin: 1em 0 1.6em; page-break-inside: avoid; }
  pre code { background: none; padding: 0; color: var(--code-text); font-size: 13px; border-radius: 0; }

  table { width: 100%; border-collapse: collapse; margin: 1em 0 1.6em; font-size: 13.5px; page-break-inside: avoid; }
  th { background: var(--ink); color: #fff; text-align: left; padding: 10px 14px; font-weight: 600; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.03em; text-transform: uppercase; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:nth-child(even) td { background: var(--paper-alt); }
  tr:hover td { background: var(--accent-soft); }

  hr { border: none; border-top: 1px solid var(--line); margin: 2.4em 0; }

  .content-footer {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 80px 40px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  @media print {
    body { font-size: 12.5px; color: #1a1a2e; }
    * { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    .cover { min-height: auto; padding: 50px 56px 40px; background-size: 18px 18px; }
    .content { padding: 40px 56px; }
    .content-footer { padding: 20px 56px 30px; }
    pre { background: #f4f5f7; border: 1px solid var(--line); }
    pre code { color: #1a1a2e; }
  }

  @media (max-width: 640px) {
    .cover { padding: 40px 28px 32px; }
    .cover h1 { font-size: 30px; }
    .doc-block { grid-template-columns: repeat(2, 1fr); row-gap: 16px; }
    .content { padding: 40px 24px 60px; }
    .content-footer { padding: 20px 24px 32px; flex-direction: column; gap: 6px; }
  }
</style>
</head>
<body>

  <div class="cover">
    <div class="cover-top">
      <span class="eyebrow">Internal Document</span>
      <div class="logo-slot">Your Logo</div>
    </div>

    <div class="cover-main">
      <span class="project-tag">{{project_name}}</span>
      <h1>{{title}}</h1>
    </div>

    <div class="doc-block">
      <div>
        <span class="doc-field-label">Version</span>
        <span class="doc-field-value">v1.0</span>
      </div>
      <div>
        <span class="doc-field-label">Status</span>
        <span class="doc-field-value">Draft</span>
      </div>
      <div>
        <span class="doc-field-label">Date</span>
        <span class="doc-field-value">{{date}}</span>
      </div>
      <div>
        <span class="doc-field-label">Owner</span>
        <span class="doc-field-value">{{owner_name}}</span>
      </div>
    </div>
  </div>

  <div class="content">
    {{content}}
  </div>

  <div class="content-footer">
    <span>{{project_name}}</span>
    <span>{{title}}</span>
  </div>

</body>
</html>
